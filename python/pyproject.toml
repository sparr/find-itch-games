[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "find-itch-games"
dynamic = ["version"]
description = "Find the itch.io app, its install locations, and the games installed in them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = 'Clarence "Sparr" Risher', email = "sparr0@gmail.com" }]
keywords = ["itch", "itch.io", "butler", "games", "search", "install", "library"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
# No runtime dependencies: sqlite3, gzip and json are all in the standard
# library, which is also why this has no minimum beyond Python itself -- unlike
# the JavaScript package, whose floor is set by `node:sqlite`.
dependencies = []

[project.urls]
Homepage = "https://sparr.github.io/find-itch-games/"
Repository = "https://github.com/sparr/find-itch-games"
Issues = "https://github.com/sparr/find-itch-games/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pdoc>=16"]

[tool.hatch.version]
# Single-sourced from the package itself, so there is no second place to forget.
path = "src/find_itch_games/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/find_itch_games"]

[tool.hatch.build.targets.sdist]
# Tests are deliberately excluded: they build their fixtures from ../../shared,
# which lives outside this package root and so cannot be in the archive. An
# sdist that ships tests it cannot run is worse than one that ships none.
include = ["src", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
